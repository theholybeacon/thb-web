# Named selectors for flows. The app has no test ids yet: these lean on lucide
# icon classes, ids, roles and structure. If a UI refactor breaks a flow, fix it
# here. Better long-term: add data-demo="name" to the component and use that.
mode.read: "button:has(svg.lucide-eye)"
mode.type: "button:has(svg.lucide-keyboard)"
mode.listen: "button:has(svg.lucide-headphones)"
reader.panel: "button:has(svg.lucide-panel-right)"
reader.characterLink: "main a[href^='/bible/people/']"
# Templated: {{param}} is filled from the flow's params for each run.
reader.personLink: "main a[href='/bible/people/{{character}}']"
type.area: "div.cursor-text"
type.text: "div.cursor-text .bible-text"
type.chars: "div.cursor-text .bible-text span.transition-colors:not(.inline-block)"
type.stats: "div:has(> div > :text('WPM'))"
type.complete: ".grid.grid-cols-3"
explore.search: "main input"
explore.reina: "a[href='/bible/rvr09-sp']"
explore.result: "a[href='/bible/{{translation}}']"
people.search: "input:visible"
people.moses: "a[href='/bible/people/moses_2108']"
people.result: "a[href='/bible/people/{{character}}']"
people.letters: "nav[aria-label='Filter by first letter']"
