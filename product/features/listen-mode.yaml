id: listen-mode
name: { en: Listen, es: Escuchar }
status: live
access: premium
signature: true
pitch:
  en: Hear every passage read aloud in a natural voice, with verse-by-verse highlighting.
  es: Escucha cada pasaje leído en voz natural, con resaltado versículo por versículo.
problem: No time to sit and read.
proof:
  - Verse-by-verse highlighting follows the audio.
  - Two voices, one female and one male; speed and volume adjustable.
